<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>light/dark theme button</title>
    <link rel="shortcut icon" href="./images/logo.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <input type="checkbox" name="toggle" id="toggle" checked />
    <label class="button" for="toggle">
      <div class="scenes">
        <div class="circle">
          <div class="circle-content">
            <div class="moon-toggle">
              <div class="hole1"></div>
              <div class="hole2"></div>
              <div class="hole3"></div>
            </div>
            <div class="sun-toggle"></div>
          </div>
        </div>
        <div class="trees">
          <div class="tree1"></div>
          <div class="tree2"></div>
        </div>
        <div class="clouds">
          <div class="cloud1"></div>
          <div class="cloud2"></div>
          <div class="cloud3"></div>
        </div>
        <div class="flower">
          <div class="stem"></div>
          <div class="leaf1"></div>
          <div class="leaf2"></div>
          <div class="vasat"></div>
          <div class="petal1"></div>
          <div class="petal2"></div>
          <div class="petal3"></div>
          <div class="petal4"></div>
          <div class="petal5"></div>
          <div class="petal6"></div>
        </div>
        <img class="astronaut" src="./images/astronaut.svg" alt="astronaut" />
      </div>
    </label>
    <script src="./main.js"></script>
  </body>
</html>
